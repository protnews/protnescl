<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>protnescl · perfil</title>
<style>
  :root { --bg:#0a0a0f; --card:#14141c; --accent:#ff5722; --text:#f5f5f7; --muted:#9a9aa5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border:1px solid #ffffff14; border-radius:24px; padding:40px 32px; max-width:420px; width:100%; text-align:center; }
  .avatar { width:96px; height:96px; border-radius:50%; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; background:var(--accent); font-size:40px; font-weight:800; color:#fff; box-shadow:0 0 40px #ff572244; }
  h1 { font-size:26px; font-weight:700; letter-spacing:.5px; }
  .tag { color:var(--accent); font-size:13px; font-weight:600; margin-top:6px; letter-spacing:2px; text-transform:uppercase; }
  .desc { color:var(--muted); font-size:14.5px; line-height:1.6; margin-top:18px; }
  .links { display:flex; flex-direction:column; gap:10px; margin-top:26px; }
  .links a { text-decoration:none; color:var(--text); background:#ffffff0a; border:1px solid #ffffff14; padding:12px; border-radius:12px; font-size:14px; font-weight:600; transition:.2s; }
  .links a:hover { background:#ffffff14; transform:translateY(-1px); }
  .footer { color:var(--muted); font-size:12px; margin-top:26px; }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">?</div>

    <p class="desc">Acá va tu descripción: quién sos, qué hacés, qué te gusta. Pegame tus datos y lo lleno wawa.</p>
    <div class="links">
      <a href="#" target="_blank" rel="noopener">🔗 GitHub</a>
      <a href="#" target="_blank" rel="noopener">💬 Discord</a>
      <a href="#" target="_blank" rel="noopener">▶️ YouTube</a>
    </div>
    <div class="footer">protnescl.github.io · hecho en la raspberry 🍓</div>
  </main>
</body>
</html>
